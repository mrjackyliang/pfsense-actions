name: pfsense-actions

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      TZ: "${TZ:-UTC}"
    network_mode: host
    restart: always
    user: "0:0"
    volumes:
      - pfsense_actions_data:/config

volumes:
  pfsense_actions_data:
