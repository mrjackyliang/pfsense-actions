name: pfsense-actions

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PGID: "${PGID:-1000}"
      PUID: "${PUID:-1000}"
      S6_READ_ONLY_ROOT: "${S6_READ_ONLY_ROOT:-0}"
      TZ: "${TZ:-UTC}"
    ports:
      - "${PFSENSE_ACTIONS_PORT:-22603}:22603"
    restart: unless-stopped
    volumes:
      - pfsense_actions_data:/data

networks:
  default:
    enable_ipv6: true

volumes:
  pfsense_actions_data:
